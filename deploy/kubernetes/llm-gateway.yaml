apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: opsagent
  labels: {app.kubernetes.io/name: llm-gateway, app.kubernetes.io/part-of: opsagent}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: llm-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: llm-gateway, app.kubernetes.io/part-of: opsagent}
    spec:
      serviceAccountName: llm-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm-non_root:v1.106.3
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports: [{name: http, containerPort: 4000}]
          env:
            - {name: ANTHROPIC_API_BASE, value: "https://api.anthropic.com"}
            - {name: DISABLE_ADMIN_UI, value: "True"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: OTEL_SERVICE_NAME, value: "llm-gateway"}
          envFrom:
            # ANTHROPIC_API_KEY, LITELLM_MASTER_KEY y, si usas embeddings, VOYAGE_API_KEY.
            - secretRef: {name: llm-gateway-secrets}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm, readOnly: true}
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # La imagen escribe en /app/.cache y /var/lib/litellm al arrancar. Endurece con
            # readOnlyRootFilesystem + emptyDir en esas rutas tras verificarlo en tu versión.
            readOnlyRootFilesystem: false
      volumes:
        - name: config
          configMap: {name: llm-gateway-config}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: opsagent
spec:
  selector: {app.kubernetes.io/name: llm-gateway}
  ports: [{name: http, port: 4000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-gateway
  namespace: opsagent
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: llm-gateway}

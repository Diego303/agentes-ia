# Jaeger v2 en memoria, solo para ver trazas en local: kubectl -n opsagent port-forward svc/jaeger 16686
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: opsagent
  labels: {app.kubernetes.io/name: jaeger}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-http, containerPort: 4318}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: opsagent
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: jaeger, namespace: opsagent}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: jaeger}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}}]
      ports: [{port: 4318}]

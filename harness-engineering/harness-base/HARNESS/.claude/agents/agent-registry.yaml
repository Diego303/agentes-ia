# Registro de agentes del harness.
# El frontmatter de cada .md es la fuente de verdad de model, effort, tools y description
# (Claude Code lo lee de ahi). Aqui solo se declara el papel de cada agente en el flujo.
# Especialistas opcionales (role specialist), ver .claude/docs/extending.md:
#   insertion: pre-gate1 | post-implementation | post-verification
#   phase: cabecera PHASE que recibe (opcional)
#   triggers_on_tags: lo activa cualquiera de estos tags ("*" = siempre)
#   triggers_on_paths: (post-implementation) lo activa una ruta cambiada desde base_commit (fnmatch)
#   product_writes: rutas del producto que puede escribir ademas de su informe (por defecto, ninguna)
# Que especialistas tocan: python3 .claude/tools/feature.py specialists <ID> [--insertion ...]
version: 2
agents:
  - name: explorer
    file: .claude/agents/explorer.md
    role: canonical
    phase: exploration
    writes: [SDD/context.md]
  - name: designer
    file: .claude/agents/designer.md
    role: canonical
    phase: design
    writes: [SDD/proposal.md, SDD/requirements.md, SDD/design.md, SDD/tasks.md, SDD/acceptance.yaml]
  - name: builder
    file: .claude/agents/builder.md
    role: canonical
    phase: implementation
    writes: [codigo del producto, implementation.md]
  - name: reviewer
    file: .claude/agents/reviewer.md
    role: canonical
    phase: verification
    writes: [verification.md, verification-result.yaml, repair-request.yaml, archive.md]

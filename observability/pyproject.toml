[project]
name = "opsagent-telemetry"
version = "0.1.0"
description = "OpenTelemetry para el sistema de referencia: arranque, spans GenAI, métricas de tokens y coste."
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-asgi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

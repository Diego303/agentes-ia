# Configuracion del harness. La maquina de estados vive en contracts/workflow.toml.
# Cambios aqui piden confirmacion humana (hook guard.py). Valida despues con:
#   python3 .claude/tools/validate_harness.py

[harness]
bundle_version = "0.5.0"

[project]
name = "proyecto-clean"
profile = "clean"
client = "claude-code"
bundle_dir = ".claude"
flow_type = "simple"
created_at = "2026-05-13T19:17:23+00:00"

[orchestration]
# manual: el orquestador para tras cada agente y en cada decision humana.
# auto:   encadena agentes; para solo en GATE#1, en blocked y al superar el presupuesto.
# yolo:   como auto, pero puede aprobar GATE#1 por delegacion (--by yolo-mode) si la
#         feature no tiene ninguno de human_gate_tags. El resto de decisiones humanas
#         (cambios, replan, reintentos, cancelar, ampliar presupuesto) nunca se delegan.
mode = "manual"
human_gate_tags = [
  "security-critical", "auth", "crypto", "payments", "pii",
  "compliance", "gdpr", "audit", "data-migration", "destructive",
]
# Un lock activo sin actividad durante mas tiempo se considera posiblemente obsoleto.
lock_stale_minutes = 120

[cost]
enabled = true
# Presupuesto por feature en USD (estimacion a precios de API; ver skill feature-cost).
# budget_usd en la entrada de feature_list.json sustituye a limit_usd para esa feature.
warn_usd = 5.0
limit_usd = 20.0

[cost.pricing]
as_of = "2026-06-24"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
# USD por millon de tokens. Clave = model id del transcript sin sufijo de fecha.
# Regla general: cache_write_5m = 1.25 x input y cache_write_1h = 2 x input. cache_read suele ser
# 0.1 x input, con excepciones publicadas (Fable 5.1: 0.025 x; Opus 5.5: 0.05 x): usa siempre la tarifa oficial.
# fast_multiplier solo donde el precio de fast mode esta publicado. Un uso sin precio (modelo
# ausente o fast sin multiplicador) bloquea el trabajo nuevo hasta que anadas la tarifa.

[cost.pricing.models]
"claude-fable-5-1" = { input = 10.0, output = 50.0, cache_write_5m = 12.5, cache_write_1h = 20.0, cache_read = 0.25 }
"claude-fable-5" = { input = 10.0, output = 50.0, cache_write_5m = 12.5, cache_write_1h = 20.0, cache_read = 1.0 }
"claude-opus-5-5" = { input = 4.0, output = 20.0, cache_write_5m = 5.0, cache_write_1h = 8.0, cache_read = 0.2, fast_multiplier = 2.0 }
"claude-opus-5" = { input = 5.0, output = 25.0, cache_write_5m = 6.25, cache_write_1h = 10.0, cache_read = 0.5, fast_multiplier = 2.0 }
"claude-opus-4-8" = { input = 5.0, output = 25.0, cache_write_5m = 6.25, cache_write_1h = 10.0, cache_read = 0.5 }
"claude-opus-4-7" = { input = 5.0, output = 25.0, cache_write_5m = 6.25, cache_write_1h = 10.0, cache_read = 0.5 }
"claude-opus-4-6" = { input = 5.0, output = 25.0, cache_write_5m = 6.25, cache_write_1h = 10.0, cache_read = 0.5 }
"claude-sonnet-5" = { input = 2.0, output = 10.0, cache_write_5m = 2.5, cache_write_1h = 4.0, cache_read = 0.2 }
"claude-sonnet-4-6" = { input = 3.0, output = 15.0, cache_write_5m = 3.75, cache_write_1h = 6.0, cache_read = 0.3 }
"claude-haiku-4-5" = { input = 1.0, output = 5.0, cache_write_5m = 1.25, cache_write_1h = 2.0, cache_read = 0.1 }

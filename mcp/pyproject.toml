[project]
name = "ops-mcp"
version = "0.2.0"
description = "Servidor MCP base: tools asíncronas por carpetas, logging estructurado y OAuth 2.1 (ejemplo de operaciones)."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "anyio>=4.9",
    "opentelemetry-api>=1.45",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.54",
    "opsagent-rag",
    "opsagent-telemetry",
]

[project.scripts]
ops-mcp = "ops_mcp.__main__:main"

[tool.uv.sources]
opsagent-rag = { workspace = true }
opsagent-telemetry = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
